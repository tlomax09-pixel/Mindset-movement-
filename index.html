function ring(pct, color, size=70, sw=7){ const r=(size-sw)/2, c=2*Math.PI*r, p=Math.max(0,Math.min(1,pct)); return `<svg viewBox="0 0 ${size} ${size}"><circle class="trk" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="${sw}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}" style="transition:stroke-dashoffset .5s ease"/></svg>`; }
const fmtTime = s => `${Math.floor(s/60)}:${pad(Math.floor(s%60))}`;
const greeting = () => { const h=new Date().getHours(); return h<12?'Good morning':h<17?'Good afternoon':'Good evening'; };
const wpm = 150;
function woSeq(w){ const seq=[{type:'ready', secs:10, move:w.moves[0]}]; for(let r=1;r<=w.rounds;r++){ w.moves.forEach((m,i)=>{ seq.push({type:'work', secs:w.work, move:m, round:r, i}); const last = r===w.rounds && i===w.moves.length-1; if(!last) seq.push({type:'rest', secs:w.rest, move:w.moves[(i+1)%w.moves.length], round:r}); }); } return seq; }
const woMins = w => Math.round(woSeq(w).reduce((a,s)=>a+s.secs,0)/60);
const fmtQty = q => { let whole=Math.floor(q); const fs=[0,.25,1/3,.5,2/3,.75,1]; let f=fs.reduce((a,b)=>Math.abs(b-(q-whole))<Math.abs(a-(q-whole))?b:a); if(f===1){whole++;f=0;} f=+f.toFixed(2); const fr={0.25:'¼',0.33:'⅓',0.5:'½',0.67:'⅔',0.75:'¾'}[f]; if(!f) return String(whole); if(fr) return (whole?whole:'')+fr; return String(+q.toFixed(1)); };
const moodColor = k => ['var(--line)','#7C8A93','#A3A08F','#B9A36A','#8FB59A','var(--gold)'][k];

// ---------- routing ----------
const TABS = [['home','Home','home'],['talks','Walk Talks','talk'],['workouts','Workouts','dumbbell'],['recipes','Recipes','food'],['habits','Habits','checksq']];
let tab = 'home';
const filters = {talks:'All', workouts:'All', recipes:'All'};
function go(t, push=true){ tab=t; if(push){ try{ history.replaceState(null,'','#'+t);}catch(e){ location.hash=t; } } render(); window.scrollTo(0,0); }
function renderTabs(){ document.getElementById('tabs').innerHTML = TABS.map(([id,l,ic])=>`<button data-tab="${id}" ${tab===id?'aria-current="page"':''}>${I(ic)}<span>${l}</span></button>`).join(''); }
document.getElementById('tabs').addEventListener('click', e=>{ const b=e.target.closest('[data-tab]'); if(b) go(b.dataset.tab); });
window.addEventListener('hashchange', ()=>{ const h=location.hash.slice(1); if(TABS.some(t=>t[0]===h) && h!==tab) go(h,false); });

function render(){ renderTabs(); const v={home:vHome,talks:vTalks,workouts:vWorkouts,recipes:vRecipes,habits:vHabits}[tab]; document.getElementById('app').innerHTML = v(); }

// ---------- sheets ----------
let sheetCleanup = null;
function openSheet(html, mount){ closeSheet(); const r=document.getElementById('sheet-root'); r.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="wrap">${html}</div></div>`; document.body.style.overflow='hidden'; const el=r.firstElementChild; sheetCleanup = mount ? mount(el) : null; el.querySelector('[data-close]')?.focus(); }
function closeSheet(){ if(sheetCleanup){ try{sheetCleanup();}catch(e){} sheetCleanup=null; } document.getElementById('sheet-root').innerHTML=''; document.body.style.overflow=''; }
const sheetTop = (title='') => `<div class="sheet-top"><button class="iconbtn" data-close aria-label="Close">${I('left')}</button><span class="eyebrow">${esc(title)}</span><span style="width:42px"></span></div>`;
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && document.querySelector('.sheet')) { closeSheet(); render(); } });

// --- speech ---
const synth = window.speechSynthesis;
let voicePick = null;
function getVoice(){ if(voicePick || !synth) return voicePick; const vs=synth.getVoices().filter(v=>/^en/i.test(v.lang)); voicePick = vs.find(v=>/samantha|ava|allison|aria|jenny|zira|female|serena|karen|moira|tessa/i.test(v.name)) || vs[0] || null; return voicePick; }
if (synth) synth.onvoiceschanged = () => { voicePick=null; getVoice(); };
function speak(text, onend){ if(!synth) { onend&&onend(); return null; } const u=new SpeechSynthesisUtterance(text); const v=getVoice(); if(v) u.voice=v; u.rate=.92; u.pitch=1.02; u.onend=()=>onend&&onend(); u.onerror=()=>{}; synth.speak(u); return u; }

// --- Walk Talk player ---
function openTalk(id){
  const t = TALKS.find(x=>x.id===id); if(!t) return;
  const items=[]; t.sections.forEach((s,si)=>{ if(s.walk) items.push({si, walk:true, label:s.label, secs:s.walk, cue:s.cue}); else s.text.split(/\n\n+/).forEach(p=>items.push({si, label:s.label, text:p.trim()})); });
  const est = items.map(it=> it.walk ? it.secs : it.text.split(/\s+/).length/150*60);
  const totalEst = est.reduce((a,b)=>a+b,0);
  const target = t.mins*60;
  const html = `${sheetTop('Walk Talk')}
  <div class="player-hero">
    <div class="info"><span class="tag">${esc(t.cat)}</span><h2 style="color:var(--on-green)">${esc(t.title)}</h2><span class="timer" id="tt">0:00</span><span style="font-size:.8rem;opacity:.75">of ${t.mins}:00 walk</span></div>
    <img src="${DOLLS.strength}" alt="">
    <div class="ctrls"><button class="play" id="tplay" aria-label="Start">${I('play')}</button>
      ${synth?`<button class="pill" id="tvoice" aria-pressed="true">${I('voice')} Voice guide</button>`:''}
      <button class="pill" id="tfinish">${I('check')} Finish</button></div>
    <div class="hbar"><i id="tbar"></i></div>
  </div>
  <p class="sub" style="font-size:.85rem;margin-top:12px">${synth?'Press play and the voice guide talks you through your walk, with timed walking breaks in between. Turn the voice off to read along at your own pace. Tap any part to jump there.':'Press play to start your walk timer and read along. Timed walking breaks are built in. Tap any part to jump there.'}</p>
  <div class="script" id="script">${items.map((it,i)=>{ const head = (i===0||items[i-1].si!==it.si) && !it.walk ? `<div class="sec">${esc(it.label)}</div>` : '';
      return it.walk ? `<div class="walkbreak" data-p="${i}"><div class="row between"><span class="wb-label">${I('steps')} ${esc(it.label)}</span><span class="wb-time" data-left="${i}">${fmtTime(it.secs)}</span></div><p class="wb-cue">${esc(it.cue)}</p><div class="bar gold"><i data-wbar="${i}" style="width:0%"></i></div></div>`
                     : `${head}<p data-p="${i}">${esc(it.text)}</p>`; }).join('')}
    <div class="sec">Carry this with you</div><p class="closing" style="cursor:default">${esc(t.closing)}</p></div>
  <div id="reflect" class="card stack" style="margin-top:24px" hidden>
    <span class="tag gold">Reflect</span><h3>${esc(t.prompt)}</h3>
    <label class="visually-hidden" for="reflect-text">Your reflection</label>
    <textarea id="reflect-text" placeholder="Write what came up on your walk..."></textarea>
    <div class="row"><button class="btn green" id="rsave">Save to journal</button><button class="btn ghost" data-close>Done</button></div>
  </div>
  <div style="height:20px"></div>`;
  openSheet(html, el=>{
    let running=false, elapsed=0, cur=-1, voiceOn=!!synth, timer=null, finished=false, lock=null, walkLeft=0, gen=0;
    const $ = s=>el.querySelector(s);
    const ps = [...el.querySelectorAll('[data-p]')];
    function mark(i, scroll=true){ cur=i; ps.forEach((p,j)=>{ p.classList.toggle('now', j===i); p.classList.toggle('read', j<i); }); if(scroll && ps[i]) ps[i].scrollIntoView({behavior:'smooth', block:'center'}); }
    function showWalk(i, left){ const it=items[i]; const l=el.querySelector(`[data-left="${i}"]`), b=el.querySelector(`[data-wbar="${i}"]`); if(l) l.textContent=fmtTime(Math.max(0,left)); if(b) b.style.width=Math.min(100,(1-left/it.secs)*100)+'%'; }
    function speakFrom(i){
      if(!synth) return; synth.cancel(); gen++; const g=gen;
      if(i>=items.length){ mark(items.length,false); toast('Talk complete. Keep walking or tap Finish.'); return; }
      mark(i); const it=items[i];
      const next=()=>{ if(g!==gen || !running || !voiceOn) return; setTimeout(()=>{ if(g===gen && running && voiceOn) speakFrom(i+1); }, 900); };
      if(it.walk){ walkLeft=it.secs; showWalk(i,walkLeft); speak(`${it.label}. ${Math.round(it.secs/60)} minutes. ${it.cue}`); }
      else speak(it.text, next);
    }
    function tick(){
      elapsed++; $('#tt').textContent=fmtTime(elapsed); $('#tbar').style.width=Math.min(100,elapsed/target*100)+'%';
      if(voiceOn){
        const it=items[cur];
        if(it && it.walk && walkLeft>0){ walkLeft--; showWalk(cur,walkLeft); if(walkLeft===0){ beep(660,.15); setTimeout(()=>beep(990,.25),180); speakFrom(cur+1); } }
      } else {
        let acc=0, idx=items.length-1; const pos=elapsed/target*totalEst; for(let i=0;i<est.length;i++){ if(pos<acc+est[i]){ idx=i; break; } acc+=est[i]; }
        if(idx!==cur) mark(idx);
        if(items[idx]?.walk) showWalk(idx, Math.round(acc+est[idx]-pos));
      }
      if(elapsed===target) toast('You hit your walk goal. Keep going or tap Finish.');
    }
    function setPlay(){ $('#tplay').innerHTML = running?I('pause'):I('play'); $('#tplay').setAttribute('aria-label', running?'Pause':'Play'); }
    async function start(){ running=true; timer=setInterval(tick,1000); setPlay();
      if(voiceOn){ const it=items[cur]; if(it && it.walk && walkLeft>0){ /* resume the walking break */ } else speakFrom(Math.max(cur,0)); } else if(cur<0) mark(0);
      try{ lock = await navigator.wakeLock?.request('screen'); }catch(e){} }
    function pause(){ running=false; clearInterval(timer); setPlay(); gen++; if(synth) synth.cancel(); }
    $('#tplay').onclick=()=> running?pause():start();
    $('#tvoice') && ($('#tvoice').onclick=()=>{ voiceOn=!voiceOn; $('#tvoice').setAttribute('aria-pressed',voiceOn); gen++; synth.cancel(); if(voiceOn && running) speakFrom(Math.max(cur,0));
      if(!voiceOn){ let acc=0; for(let i=0;i<Math.max(cur,0);i++) acc+=est[i]; elapsed=Math.max(elapsed, Math.round(acc/totalEst*target)); } });
    el.querySelector('#script').addEventListener('click', e=>{ const p=e.target.closest('[data-p]'); if(!p) return; const i=+p.dataset.p;
      if(voiceOn){ walkLeft=0; if(running) speakFrom(i); else { mark(i,false); if(items[i].walk){ walkLeft=items[i].secs; showWalk(i,walkLeft); } } }
      else { let acc=0; for(let k=0;k<i;k++) acc+=est[k]; elapsed=Math.round(acc/totalEst*target); mark(i,false); } });
    $('#tfinish').onclick=()=>{ pause(); if(!finished){ finished=true; const d=day(); d.talks.push(t.id); d.minutes+=Math.max(1,Math.round(elapsed/60)); S.talkDone[t.id]=(S.talkDone[t.id]||0)+1; save(); toast('Walk Talk complete. Streak updated.'); }
      mark(items.length,false); $('#reflect').hidden=false; $('#reflect').scrollIntoView({behavior:'smooth'}); };
    $('#rsave').onclick=()=>{ const txt=$('#reflect-text').value.trim(); if(!txt){ $('#reflect-text').focus(); return; } S.journal.unshift({id:Date.now(), date:todayKey(), ts:Date.now(), mood:peek(todayKey())?.mood||0, prompt:t.prompt, text:txt, gratitude:[], source:t.title}); save(); toast('Saved to your journal'); closeSheet(); render(); };
    return ()=>{ gen++; clearInterval(timer); if(synth) synth.cancel(); try{lock&&lock.release();}catch(e){} };
  });
}

function openWorkout(id){
  const w = WORKOUTS.find(x=>x.id===id); if(!w) return;
  openSheet(`${sheetTop('Workout')}
    <div class="stack" style="gap:14px">
      <div class="row between" style="align-items:flex-end"><div class="stack" style="gap:6px;min-width:0"><span class="tag">${esc(w.focus)} · ${w.level}</span><h1 style="font-size:2.1rem">${esc(w.title)}</h1></div><img src="${DOLLS[w.doll]}" alt="" style="height:130px;flex:none"></div>
      <p class="sub">${esc(w.desc)}</p>
      <div class="facts"><div class="fact"><b>${woMins(w)} min</b><span>Total</span></div><div class="fact"><b>${w.rounds}</b><span>Rounds</span></div><div class="fact"><b>${w.work}s / ${w.rest}s</b><span>Work / rest</span></div></div>
      <button class="btn green block" id="wstart" style="height:52px">${I('play')} Start guided workout</button>
      <div class="card"><span class="eyebrow">Each round</span>${w.moves.map((m,i)=>`<div class="move-row"><span class="num">${i+1}</span><div><b>${esc(m.n)}</b><p class="sub" style="font-size:.88rem">${esc(m.c)}</p></div></div>`).join('')}</div>
      <p class="sub" style="font-size:.8rem">Move at your own pace and skip anything that doesn't feel right for your body.</p>
    </div>`, el=>{ el.querySelector('#wstart').onclick=()=>runWorkout(w); return null; });
}
let actx=null;
function beep(f=880, d=.12){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=f; o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(.15, actx.currentTime); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime+d); o.start(); o.stop(actx.currentTime+d); }catch(e){} }
function runWorkout(w){
  const seq = woSeq(w); const total = seq.reduce((a,s)=>a+s.secs,0);
  openSheet(`${sheetTop(w.title)}<div id="wo"></div>`, el=>{
    let i=0, left=seq[0].secs, running=true, timer=null, voiceOn=!!synth, spent=0, lock=null;
    const box = el.querySelector('#wo');
    try{ navigator.wakeLock?.request('screen').then(l=>lock=l).catch(()=>{}); }catch(e){}
    function announce(){ if(!voiceOn) return; const s=seq[i]; synth.cancel(); speak(s.type==='work'? s.move.n : s.type==='rest' ? `Rest. Next up, ${s.move.n}` : `Get ready. First up, ${s.move.n}`); }
    function draw(){
      const s=seq[i]; const pct=1-left/s.secs; const nxt=seq.slice(i+1).find(x=>x.type==='work');
      const color = s.type==='rest'?'var(--gold)':'var(--green-ink)';
      box.innerHTML = `
        <div class="stack" style="gap:6px;text-align:center;align-items:center">
          <span class="phase ${s.type==='rest'?'rest':'work'}">${s.type==='work'?`Round ${s.round} of ${w.rounds}`:s.type==='rest'?'Rest':'Get ready'}</span>
          <h2>${esc(s.type==='work'? s.move.n : 'Next: '+s.move.n)}</h2>
          <p class="sub" style="max-width:34ch">${esc(s.move.c)}</p>
        </div>
        <div class="wo-ring">${ring(pct,color,200,12)}<div class="c"><span class="secs">${left}</span><span class="sub" style="font-size:.85rem">seconds</span></div></div>
        <div class="bar gold" style="margin-top:18px"><i style="width:${spent/total*100}%"></i></div>
        <div class="row between sub" style="font-size:.8rem;margin-top:6px"><span>${fmtTime(spent)} done</span><span>${fmtTime(total-spent)} left</span></div>
        <div class="row" style="justify-content:center;gap:16px;margin-top:18px">
          <button class="round" data-w="prev" aria-label="Previous">${I('prev')}</button>
          <button class="play" data-w="toggle" style="width:68px;height:68px;background:var(--green);color:var(--on-green)" aria-label="${running?'Pause':'Resume'}">${running?I('pause'):I('play')}</button>
          <button class="round" data-w="next" aria-label="Skip">${I('next')}</button>
        </div>
        <div class="row" style="justify-content:center;margin-top:14px">${synth?`<button class="btn ghost sm" data-w="voice">${I('voice')} Voice cues ${voiceOn?'on':'off'}</button>`:''}</div>
        ${nxt && s.type==='work'?`<div class="card row" style="margin-top:20px"><span class="eyebrow">Up next</span><b style="flex:1;min-width:0">${esc(nxt.move.n)}</b></div>`:''}`;
    }
    function finish(){ clearInterval(timer); if(synth) synth.cancel(); const d=day(); d.workouts.push(w.id); d.minutes+=Math.max(1,Math.round(spent/60)); S.workoutDone[w.id]=(S.workoutDone[w.id]||0)+1; save(); beep(660,.15); setTimeout(()=>beep(990,.3),180); if(voiceOn) speak('Workout complete. You showed up for yourself today.');
      box.innerHTML = `<div class="done-screen"><div class="medal">${I('trophy')}</div><h1>You did it.</h1><p class="sub" style="max-width:32ch">${esc(w.title)} complete. ${Math.max(1,Math.round(spent/60))} active minutes added to today, and your workout habit is checked off.</p><img src="${DOLLS.water}" alt=""><button class="btn block" data-close>Back to workouts</button></div>`; }
    function step(dir){ i=Math.max(0, i+dir); if(i>=seq.length) return finish(); left=seq[i].secs; announce(); draw(); }
    function tick(){ if(!running) return; left--; spent++; if(left<=3 && left>0) beep(left===1?990:770); if(left<=0){ step(1); } else draw(); }
    box.addEventListener('click', e=>{ const b=e.target.closest('[data-w]'); if(!b) return; const a=b.dataset.w;
      if(a==='toggle'){ running=!running; if(!running && synth) synth.cancel(); draw(); }
      if(a==='next') step(1); if(a==='prev') step(-1);
      if(a==='voice'){ voiceOn=!voiceOn; if(!voiceOn) synth.cancel(); draw(); } });
    draw(); announce(); beep(660); timer=setInterval(tick,1000);
    return ()=>{ clearInterval(timer); if(synth) synth.cancel(); try{lock&&lock.release();}catch(e){} };
  });
}

function openRecipe(id){
  const r=RECIPES.find(x=>x.id===id); if(!r) return; let serves=r.serves; const got=new Set(), stepDone=new Set();
  openSheet(`${sheetTop('Recipe')}<div id="rec"></div>`, el=>{
    const box=el.querySelector('#rec');
    function draw(){ const k=serves/r.serves; box.innerHTML=`
      <div class="stack" style="gap:12px">
        <span class="tag gold">${r.cat}</span><h1 style="font-size:2.2rem">${esc(r.title)}</h1>
        <p class="sub">${esc(r.why)}</p>
        <div class="row between"><span class="meta">${I('clock')} ${r.mins} min</span><div class="stepper"><button data-s="-1" aria-label="Fewer servings">${I('minus')}</button><b>${serves}</b><button data-s="1" aria-label="More servings">${I('plus')}</button><span style="padding-right:10px;font-size:.85rem" class="sub">serving${serves>1?'s':''}</span></div></div>
        <div class="card"><div class="row between"><span class="eyebrow">Ingredients</span><button class="btn ghost sm" data-add-groc>${I('cart')} Add to list</button></div>
          ${r.ing.map((g,i)=>`<button class="ing ${got.has(i)?'on':''}" data-i="${i}"><span class="box">${got.has(i)?I('check'):''}</span><span class="q">${fmtQty(g[0]*k)} ${esc(g[1])}</span><span class="t">${esc(g[2])}</span></button>`).join('')}</div>
        <div class="card"><span class="eyebrow">Steps · tap as you go</span>
          ${r.steps.map((s,i)=>`<button class="step ${stepDone.has(i)?'on':''}" data-st="${i}"><span class="num">${i+1}</span><span class="t" style="padding-top:3px">${esc(s)}</span></button>`).join('')}</div>
        <button class="btn block ${S.favRecipes.includes(r.id)?'gold':''}" data-fav-in>${I('heart')} ${S.favRecipes.includes(r.id)?'Saved to favorites':'Save to favorites'}</button>
      </div>`; }
    box.addEventListener('click', e=>{
      const s=e.target.closest('[data-s]'); if(s){ serves=Math.max(1,Math.min(8,serves+ +s.dataset.s)); draw(); return; }
      const g=e.target.closest('[data-i]'); if(g){ const i=+g.dataset.i; got.has(i)?got.delete(i):got.add(i); draw(); return; }
      const st=e.target.closest('[data-st]'); if(st){ const i=+st.dataset.st; stepDone.has(i)?stepDone.delete(i):stepDone.add(i); draw(); return; }
      if(e.target.closest('[data-fav-in]')){ toggle(S.favRecipes, r.id); save(); draw(); return; }
      if(e.target.closest('[data-add-groc]')){ const k=serves/r.serves; let n=0; r.ing.forEach(g=>{ const label=`${fmtQty(g[0]*k)} ${g[1]} ${g[2]}`.replace(/\s+/g,' ').trim(); if(!S.grocery.some(x=>x.label===label)){ S.grocery.push({label, from:r.title, done:false}); n++; } }); save(); toast(n?`Added ${n} items to your grocery list`:'Already on your list'); }
    });
    draw(); return null;
  });
}
function toggle(arr, v){ const i=arr.indexOf(v); i>=0?arr.splice(i,1):arr.push(v); }

document.addEventListener('click', e=>{

  let b;
  if(b=t.closest('[data-go]')) return go(b.dataset.go);
  if(b=t.closest('[data-fav-talk]')){ toggle(S.favTalks,b.dataset.favTalk); save(); return render(); }
  if(b=t.closest('[data-fav-rec]')){ toggle(S.favRecipes,b.dataset.favRec); save(); return render(); }
  if(b=t.closest('[data-talk]')) return openTalk(b.dataset.talk);
  if(b=t.closest('[data-wo]')) return openWorkout(b.dataset.wo);
  if(b=t.closest('[data-rec]')) return openRecipe(b.dataset.rec);
  if(b=t.closest('[data-filter]')){ filters[b.dataset.filter]=b.dataset.val; return render(); }
  if(b=t.closest('[data-mood]')){ const d=day(); const k=+b.dataset.mood; d.mood = d.mood===k?0:k; save(); return render(); }
  if(b=t.closest('[data-steps]')){ const d=day(); d.steps=Math.max(0,d.steps+ +b.dataset.steps); save(); if(d.steps>=S.stepsGoal && d.steps- +b.dataset.steps<S.stepsGoal) toast('Step goal reached!'); return render(); }
  if(b=t.closest('[data-glass]')){ const d=day(); const i=+b.dataset.glass; d.water = d.water===i+1? i : i+1; save(); if(d.water===S.waterGoal) toast('Water goal reached. Habit checked off.'); return render(); }
  if(b=t.closest('[data-habit]')){ const h=S.habits.find(x=>x.id===b.dataset.habit); const d=day(); if(habitDone(h) && !d.done[h.id]){ toast('This one checks itself off automatically'); return; } d.done[h.id]=!d.done[h.id]; save(); return render(); }
  if(b=t.closest('[data-act]')){ const a=b.dataset.act;
    if(a==='settings') return openSettings();
    if(a==='journal') return openJournal();
    if(a==='grocery') return openGrocery();
    if(a==='links') return openLinks();
    if(a==='aff-next'){ S.affShift=(S.affShift||0)+1; save(); return render(); }
    if(a==='aff-speak'){ const aff=AFFIRMATIONS[(dayIndex()+(S.affShift||0))%AFFIRMATIONS.length]; if(synth){ synth.cancel(); speak(aff); } else toast('Voice isn’t available in this browser'); return; }
    if(a==='water-add'){ const d=day(); if(d.water<S.waterGoal){ d.water++; save(); if(d.water===S.waterGoal) toast('Water goal reached!'); } else toast('Water goal already reached'); return render(); }
    if(a==='steps-edit'){ const r=document.getElementById('steps-edit-row'); r.hidden=!r.hidden; if(!r.hidden) document.getElementById('steps-input').focus(); return; }
    if(a==='steps-save'){ const v=parseInt(document.getElementById('steps-input').value,10); if(!isNaN(v)&&v>=0){ day().steps=v; save(); render(); toast('Steps updated'); } return; }
  }
});
document.addEventListener('submit', e=>{
  if(e.target.id==='add-habit'){ e.preventDefault(); const v=document.getElementById('habit-input').value.trim(); if(!v) return; S.habits.push({id:'h'+Date.now(), label:v, icon:'spark'}); save(); render(); toast('Habit added'); }
});
document.addEventListener('keydown', e=>{ if(e.key==='Enter' && e.target.id==='steps-input'){ document.querySelector('[data-act="steps-save"]').click(); } });

const h0 = location.hash.slice(1); if(TABS.some(t=>t[0]===h0)) tab=h0;
render();
if(h0==='links') openLinks();
</script>

</body>
