<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mindset &amp; Movement">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ECEAE5">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>html,body{background:#ECEAE5}@media (prefers-color-scheme:dark){html,body{background:#10110F}}</style>
</head>
<body>
<title>Mindset &amp; Movement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width app column, neutral stone ground, green hero moments, black primary actions, gold for wins and streaks */
:root{
  --bg:#ECEAE5; --surface:#F8F7F4; --surface-2:#E2DFD8; --line:#D8D4CB;
  --ink:#141414; --muted:#69655D; --btn:#141414; --on-btn:#F8F7F4;
  --green:#1F4A37; --green-ink:#1F4A37; --green-soft:#DCE5DE; --on-green:#F3F0E8;
  --gold:#B0893C; --gold-ink:#8A6A27; --gold-soft:#F1E7D0;
  --shadow:0 1px 2px rgba(20,20,20,.05),0 6px 18px rgba(20,20,20,.05);
  --display:"Instrument Serif","Iowan Old Style",Georgia,serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px; --nav-h:68px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10110F; --surface:#1A1B18; --surface-2:#262722; --line:#33342E;
  --ink:#F1EEE7; --muted:#A39E94; --btn:#F1EEE7; --on-btn:#141414;
  --green:#24543F; --green-ink:#7FC0A0; --green-soft:#1C2E25; --on-green:#F3F0E8;
  --gold:#D4AE62; --gold-ink:#D9B66E; --gold-soft:#352D1E;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10110F; --surface:#1A1B18; --surface-2:#262722; --line:#33342E;
  --ink:#F1EEE7; --muted:#A39E94; --btn:#F1EEE7; --on-btn:#141414;
  --green:#24543F; --green-ink:#7FC0A0; --green-soft:#1C2E25; --on-green:#F3F0E8;
  --gold:#D4AE62; --gold-ink:#D9B66E; --gold-soft:#352D1E;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:-.005em}
h1{font-size:2.5rem;line-height:1.05}
h2{font-size:1.75rem;line-height:1.1}
h3{font-size:1.35rem;line-height:1.15}
p{margin:0}
.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.sub{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.section{margin-top:30px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.tap{transition:transform .15s ease}
.tap:active{transform:scale(.98)}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ibox{width:44px;height:44px;border-radius:13px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.ibox.green{background:var(--green-soft);color:var(--green-ink)}
.ibox.gold{background:var(--gold-soft);color:var(--gold-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:999px;background:var(--btn);color:var(--on-btn);font-weight:600}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.green{background:var(--green);color:var(--on-green)}
.btn.gold{background:var(--gold);color:#17140D}
.btn.sm{height:36px;padding:0 14px;font-size:.85rem}
.btn.block{width:100%}
.play{width:48px;height:48px;border-radius:50%;background:var(--btn);color:var(--on-btn);display:grid;place-items:center;flex:none}
.play .ic{width:18px;height:18px;fill:currentColor;stroke:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-inline:-2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 16px;border-radius:999px;background:var(--surface);color:var(--muted);font-weight:500;font-size:.9rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--on-btn)}
.meta{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.85rem}
.meta .ic{width:15px;height:15px}
.tag{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--green-ink)}
.tag.gold{color:var(--gold-ink)}
.heart{width:36px;height:36px;display:grid;place-items:center;color:var(--muted);border-radius:50%}
.heart[aria-pressed="true"]{color:var(--gold)}
.heart[aria-pressed="true"] .ic{fill:currentColor}
.list-item{display:flex;gap:14px;align-items:center;text-align:left;width:100%}
.list-item .grow{flex:1;min-width:0}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.iconbtn{width:42px;height:42px;border-radius:50%;background:var(--surface);display:grid;place-items:center;box-shadow:var(--shadow);flex:none}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--green);color:var(--on-green);border-radius:24px;padding:22px 22px 20px;min-height:230px;display:flex;flex-direction:column;justify-content:space-between}
.hero .doll{position:absolute;z-index:0;right:-34px;bottom:-16px;height:215px;pointer-events:none;filter:drop-shadow(0 8px 16px rgba(0,0,0,.25))}
.hero .q{font-family:var(--display);font-style:italic;font-size:1.55rem;line-height:1.18;max-width:64%;margin-top:10px}
.hero .eyebrow{color:color-mix(in srgb,var(--on-green) 70%,transparent)}
.hero .acts{display:flex;gap:8px;position:relative;z-index:1;margin-top:16px;flex-wrap:wrap;max-width:64%}
.hero .pill{height:34px;padding:0 14px;border-radius:999px;background:color-mix(in srgb,var(--green) 70%,#000);color:var(--on-green);font-size:.82rem;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.streak{display:inline-flex;align-items:center;gap:6px;background:var(--gold);color:#17140D;border-radius:999px;height:30px;padding:0 12px;font-weight:700;font-size:.8rem;align-self:flex-start;position:relative;z-index:1}
.streak .ic{width:15px;height:15px}

/* rings */
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ringcard{background:var(--surface);border-radius:var(--r);padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:var(--shadow);text-align:center}
.ring{position:relative;width:70px;height:70px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.trk{stroke:var(--surface-2)}
.ringcard .lbl{font-size:.78rem;color:var(--muted);font-weight:500}

/* mood */
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mood{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 2px;border-radius:14px;font-size:.74rem;font-weight:600;color:var(--muted)}
.mood .dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.mood[aria-pressed="true"]{background:var(--green-soft);color:var(--green-ink)}
.mood[aria-pressed="true"] .dot{border-color:var(--green-ink);background:var(--green-ink)}
.mood .dot i{display:block;border-radius:50%;background:var(--gold)}
.tip{background:var(--gold-soft);border-radius:14px;padding:12px 14px;font-size:.88rem;color:var(--ink)}

/* plan scroller */
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:78%;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px;margin-inline:-2px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.plan{scroll-snap-align:start;display:flex;flex-direction:column;gap:10px;text-align:left;min-width:0}
.plan h3{font-size:1.25rem}

/* talks */
.talk{display:flex;gap:14px;align-items:flex-start}
.talk .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;text-align:left}
.talk .side{display:flex;flex-direction:column;align-items:center;gap:6px}
.done-badge{display:inline-flex;align-items:center;gap:4px;color:var(--gold-ink);font-size:.78rem;font-weight:600}
.done-badge .ic{width:14px;height:14px}
.pagehead{display:flex;gap:12px;align-items:flex-end;justify-content:space-between}
.pagehead img{height:120px;margin-bottom:-6px}

/* habits */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week .d{font-size:.75rem;color:var(--muted);font-weight:600}
.week .c{width:38px;height:38px;border-radius:50%;margin:6px auto 0;display:grid;place-items:center;background:var(--surface-2);color:var(--on-btn)}
.week .c.on{background:var(--btn)}
.week .c.today{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--gold)}
.week .c .ic{width:16px;height:16px;stroke-width:2.4}
.big{font-size:2.3rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green-ink);border-radius:99px;transition:width .4s ease}
.bar.gold i{background:var(--gold)}
.round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2)}
.round.dark{background:var(--btn);color:var(--on-btn)}
.glasses{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.glass{aspect-ratio:3/4;max-width:100%;border-radius:6px 6px 10px 10px;border:2px solid var(--line);position:relative;overflow:hidden}
.glass i{position:absolute;inset:auto 0 0;height:0;background:var(--green-ink);opacity:.85;transition:height .3s ease}
.glass.on i{height:78%}
.habit{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.habit .chk{width:40px;height:40px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--muted)}
.habit.on .chk{background:var(--btn);color:var(--on-btn)}
.habit.on .name{text-decoration:line-through;color:var(--muted)}
.habit .name{flex:1;min-width:0;font-weight:500}
.habit .auto{font-size:.72rem;color:var(--gold-ink);font-weight:600;display:block;text-decoration:none}
.add-row{display:flex;gap:8px}
.add-row input{flex:1;min-width:0;height:46px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 18px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:1.6rem;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{font-size:.8rem;color:var(--muted)}
.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:140px;position:relative;padding-top:8px}
.chart .col{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart .b{width:100%;max-width:28px;border-radius:7px 7px 3px 3px;background:var(--green-ink);min-height:3px}
.chart .b.met{background:var(--gold)}
.chart .col span{font-size:.7rem;color:var(--muted);font-weight:600}
.chart .goal{position:absolute;left:0;right:0;border-top:1.5px dashed var(--gold);pointer-events:none}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:.7rem;font-weight:600;color:var(--muted);position:relative}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
nav.tabs .ic{width:22px;height:22px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;animation:up .28s ease;padding-top:env(safe-area-inset-top,0px)}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet .wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(40px + env(safe-area-inset-bottom,0px))}
.sheet-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;position:sticky;top:0;z-index:2;padding-block:6px;background:var(--bg)}

/* player */
.player-hero{background:var(--green);color:var(--on-green);border-radius:24px;padding:22px;position:relative;overflow:hidden}
.player-hero img{position:absolute;z-index:0;right:-8px;bottom:-10px;height:190px;filter:drop-shadow(0 8px 16px rgba(0,0,0,.25))}
.player-hero .info{max-width:62%;display:flex;flex-direction:column;gap:8px;position:relative;z-index:1}
.player-hero .tag{color:var(--gold)}
.timer{font-size:2.6rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.ctrls{display:flex;align-items:center;gap:8px;margin-top:18px;position:relative;z-index:1;flex-wrap:wrap;max-width:72%}
.ctrls .play{background:var(--gold);color:#17140D;width:56px;height:56px}
.ctrls .pill{height:38px;padding:0 12px;border-radius:999px;background:color-mix(in srgb,var(--green) 70%,#000);color:var(--on-green);font-size:.82rem;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.ctrls .pill[aria-pressed="false"]{opacity:.65}
.hbar{max-width:72%;height:5px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden;margin-top:16px;position:relative;z-index:1}
.hbar i{display:block;height:100%;background:var(--gold);width:0;transition:width .8s linear}
.script{display:flex;flex-direction:column;gap:6px}
.script .sec{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--gold-ink);margin-top:18px}
.script p{font-size:1.06rem;line-height:1.65;padding:8px 12px;margin-inline:-12px;border-radius:12px;cursor:pointer;color:var(--muted);transition:background .3s,color .3s;white-space:pre-line}
.script p.now{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.script p.read{color:var(--ink)}
.walkbreak{background:var(--green-soft);border-radius:14px;padding:12px 14px;margin:10px 0;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:box-shadow .3s}
.walkbreak.now{box-shadow:0 0 0 2px var(--gold)}
.walkbreak .wb-label{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--green-ink)}
.walkbreak .wb-label .ic{width:16px;height:16px}
.walkbreak .wb-time{font-weight:700;font-variant-numeric:tabular-nums;color:var(--green-ink)}
.script .walkbreak .wb-cue{font-size:.98rem;line-height:1.5;color:var(--ink);padding:0;margin:0;background:none;box-shadow:none;cursor:pointer}
.linkrow{color:inherit;text-decoration:none}
a.linkrow .ic:last-child{color:var(--muted)}
.soon{display:inline-block;align-self:flex-start;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-ink);background:var(--gold-soft);border-radius:999px;padding:2px 9px;margin-top:2px}
.linkchip{display:inline-flex;align-items:center;background:var(--surface-2);color:var(--ink);text-decoration:none;font-size:.82rem;height:32px}
.closing{font-family:var(--display);font-style:italic;font-size:1.45rem;line-height:1.25;color:var(--green-ink);border-left:3px solid var(--gold);padding-left:14px}
textarea{width:100%;min-height:120px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:12px 14px;resize:vertical;line-height:1.5}
.field{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px}

/* workout player */
.wo-ring{position:relative;width:min(260px,72vw);aspect-ratio:1;margin:8px auto 0}
.wo-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.wo-ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.wo-ring .secs{font-size:4rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.03em}
.phase{font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.phase.work{color:var(--green-ink)} .phase.rest{color:var(--gold-ink)}
.move-row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.move-row:last-child{border-bottom:0}
.num{width:28px;height:28px;border-radius:50%;background:var(--green-soft);color:var(--green-ink);display:grid;place-items:center;font-size:.8rem;font-weight:700;flex:none;font-variant-numeric:tabular-nums}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fact{background:var(--surface);border-radius:14px;padding:12px;text-align:center}
.fact b{display:block;font-size:1.15rem}
.fact span{font-size:.75rem;color:var(--muted)}
.done-screen{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:20px}
.done-screen img{height:220px}
.medal{width:72px;height:72px;border-radius:50%;background:var(--gold);color:#17140D;display:grid;place-items:center}
.medal .ic{width:34px;height:34px;stroke-width:2.4}

/* recipe */
.ing{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.ing:last-child{border-bottom:0}
.box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:var(--on-btn)}
.ing.on .box,.step.on .box{background:var(--green-ink);border-color:var(--green-ink)}
.ing.on .t,.step.on .t{color:var(--muted);text-decoration:line-through}
.ing .q{font-weight:700;min-width:62px;font-variant-numeric:tabular-nums}
.step{display:flex;gap:12px;align-items:flex-start;padding:10px 0;text-align:left;width:100%}
.stepper{display:inline-flex;align-items:center;gap:10px;background:var(--surface);border-radius:999px;padding:4px}
.stepper button{width:32px;height:32px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center}
.stepper b{min-width:24px;text-align:center;font-variant-numeric:tabular-nums}

/* journal */
.entry{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.entry .when{font-size:.78rem;color:var(--muted);font-weight:600}
.empty{text-align:center;padding:24px 12px;color:var(--muted);font-size:.9rem;border:1.5px dashed var(--line);border-radius:var(--r)}

<script>
// Each talk mixes spoken sections ({label, text}) with timed walking intervals ({label, walk: seconds, cue}).
const W = (label, walk, cue) => ({label, walk, cue});
const TALKS = [
{
id: "enough", cat: "Confidence", title: "You Are Enough — Right Now",
desc: "A gentle reminder that you don't need to earn your worth.",
prompt: "Where in my life have I been trying to earn a worth I already have?",
closing: "I am enough right now. I am not waiting to become worthy. I am walking as someone who already is.",
sections: [
{ label: "Settle in", text: `Hey, beautiful. Welcome to your walk.

For the next thirty minutes or so, this time belongs to you. Not to your phone, not to your to-do list, not to anybody who needs something from you. Just you, your breath, and your feet.

Before we go anywhere, let's arrive. Let your shoulders drop away from your ears. Unclench your jaw. Soften the space between your eyebrows. Take one slow breath in through your nose, and let it all the way out through your mouth. One more. In, and out.

Find a pace that feels easy. This isn't a race. Let your arms swing loose at your sides. For the first few minutes, all I want you to do is walk and notice. Notice the air on your skin. Notice what you can hear. Notice how your body feels today, without judging any of it.` },
W("Warm-up walk", 240, "Walk at an easy pace. Breathe in for four steps and out for four steps. Just arrive."),
{ label: "The list we carry", text: `Welcome back. Let your pace pick up just a little now.

I want to talk about something so many of us carry without even realizing it. It's a quiet list in the back of your mind. A list of conditions you have to meet before you're allowed to feel good about yourself.

When I lose the weight, then I'll feel confident. When I get the promotion, then I'll feel proud. When the house is clean, when the kids are perfect, when the business takes off, when I finally have it all together, then I'll be enough.

Sound familiar?

Here's the thing about that list. It never ends. Every time you check one box, another one shows up. You reach the goal weight, and suddenly it's about the stomach. You get the promotion, and now it's about the next title. The finish line keeps moving, because it was never really a finish line. It was a treadmill.

You were never meant to spend your life trying to qualify for your own love.` },
{ label: "Where worth comes from", text: `So let's get clear on something. Your worth was not handed to you at a finish line. It came with you when you were born.

Think about a newborn baby. She can't do anything. She can't work, she can't cook, she can't achieve a single thing. And yet nobody looks at a baby and says, well, she hasn't earned it yet. We look at her and we just know. She matters. She is precious. She is enough.

That was you once. And nothing that has happened since then has changed that truth. Not the mistakes. Not the extra pounds. Not the job you lost or the relationship that ended or the goals you haven't hit yet. Your value was there before every single accomplishment, and it will be there after all of them.

Accomplishments are beautiful. Go after them. But they are things you do. They are not who you are.` },
W("Walk with it", 180, "As you walk, ask yourself: what is on my list? What have I been telling myself I need before I'm allowed to feel good about me?"),
{ label: "Proof you already have", text: `Let's look at the evidence, because your mind likes proof.

Think about one hard thing you have already survived. Maybe it was a loss that brought you to your knees. A season where you didn't know how you'd pay the bills. A diagnosis. A breakup. A day you got up when everything in you wanted to stay in bed.

You made it through that. Not because you were perfect. Not because you had it all figured out. You made it through because there is something strong and good inside of you that kept going.

Now think about someone who loves you. Really picture their face. They don't love you because of your to-do list. They don't love you because of your dress size or your bank account. They love the way you laugh. The way you show up for people. The way you care so deeply. The way you light up a room when you're comfortable.

If they can see your value without any conditions, you are allowed to see it too.` },
{ label: "The voice in your head", text: `Let's talk about the voice in your head for a minute. The one that says you're not doing enough, you're not pretty enough, you're not disciplined enough, you're behind.

That voice is not the truth. That voice is a collection of old comments, comparisons, and fears that you picked up along the way. Maybe from a parent who was hard on you. Maybe from a magazine. Maybe from scrolling past a hundred highlight reels on social media.

You don't have to fight that voice. You just have to stop believing everything it says. When it shows up today, try this. Notice it, and say, thank you for sharing, but I'm choosing a different thought. Then replace it with something kinder.

I'm not behind. I'm on my own path.
I'm not lazy. I'm tired and I'm still showing up.
I'm not too much. I'm exactly enough.` },
W("Power walk", 180, "Pick up the pace for three minutes. Arms pumping, chin lifted. Walk like a woman who knows she belongs here."),
{ label: "Walk it into your body", text: `Beautiful. Keep a strong pace if you can, or ease back if you need to.

Confidence isn't only a thought. It lives in your body too. So let's practice walking like someone who already knows she's enough.

Lift your chest just a little. Roll your shoulders back and down. Let your gaze come up off the ground and look ahead. Let your stride open up. Feel your feet press into the earth. That ground is holding you up without asking you to prove anything first.

With every step, I want you to start letting this land. Step. I am enough. Step. I am enough. Let it match your rhythm. Left foot, I am. Right foot, enough.

It might feel a little silly. That's okay. Your body is learning something your mind has forgotten. Keep going.` },
W("Affirmation walk", 180, "Repeat with every step: I am enough. I am enough. Say it out loud if you can, or whisper it in your heart."),
{ label: "Growth from fullness", text: `Now, I want to be clear. Knowing you are enough does not mean you stop growing. You can still have goals. You can still want to get stronger, eat better, build the business, glow all the way up.

The difference is where it comes from.

When you grow from a place of lack, every goal feels like a punishment. You're working out because you hate your body. You're eating salad because you're ashamed. You're hustling because you feel like you're not worth anything unless you're producing. That kind of growth is exhausting, and it rarely lasts.

But when you grow from a place of fullness, everything changes. You move your body because you love her and want her to feel good. You nourish yourself because you deserve to be nourished. You chase your dreams because you're excited about what's possible, not because you're trying to prove something.

Growth that comes from love lasts so much longer than growth that comes from shame.` },
W("Walk with it", 180, "Pick one goal you're working on. As you walk, ask: what would it feel like to chase this from love instead of pressure?"),
{ label: "Treat yourself like you matter", text: `Here's a practical way to live this out today. Start treating yourself the way you would treat someone who is enough.

What would that look like? Maybe it means drinking your water because your body deserves care. Maybe it means taking a real lunch break instead of eating over the sink. Maybe it means saying no to something that drains you, without writing a three-paragraph apology. Maybe it means putting on the outfit that makes you feel good, even if you're just running errands.

Small acts of care send a big message to your nervous system. They say, I matter. I'm worth the time. I'm worth the effort.

And the more you act like it, the more you'll believe it.` },
W("Cool-down walk", 300, "Slow your pace. Let your breathing settle. Notice how your body feels now compared to when you started."),
{ label: "Close", text: `As we wrap up, take one more deep breath. Breathe in confidence. Breathe out the need to prove yourself.

Place a hand on your heart if you'd like. Feel it beating. It has never once asked you to earn it.

Repeat after me, out loud or in your heart: I am enough right now. I am not waiting to become worthy. I am walking as someone who already is.

Keep walking as long as you'd like. And carry this with you today. You don't have to earn your place. You already have one.` }
]},
{
id: "showingup", cat: "Self-Discipline", title: "The Power of Showing Up",
desc: "How small daily actions create massive transformation.",
prompt: "What is one small thing I can show up for every day this week, no matter how I feel?",
closing: "I show up for myself. Small steps, every day, are building the life I want.",
sections: [
{ label: "Arrive", text: `Hey, you showed up. Let's start right there.

Whatever it took to get you out here today, the weather, the schedule, the kids, the voice that said maybe tomorrow, you moved past it. That matters more than you think. Give yourself a little credit before we even begin.

Take a deep breath in. Hold it for a second at the top. And let it go. Let your walk settle into a steady rhythm. Nothing fancy. Just one foot in front of the other.

Today we're talking about the most underrated skill in the world. Not talent. Not motivation. Showing up.` },
W("Warm-up walk", 240, "Walk at an easy, steady pace. Notice your breath and let your body warm up."),
{ label: "Small is not nothing", text: `We are taught to chase big moments. The dramatic before and after picture. The thirty day transformation. The New Year's reset where everything changes overnight.

But real change rarely looks dramatic while it's happening. It looks like drinking your water when nobody's watching. Taking a ten minute walk on a busy day. Choosing the vegetables. Going to bed a little earlier. Saying no to something that drains you. Reading two pages instead of scrolling.

Each one of those actions seems small. Almost too small to count. You might even think, what's the point? This won't change anything.

But here's what's really happening. You are not just doing an action. You are casting a vote for the kind of woman you are becoming. Every glass of water is a vote for a woman who takes care of herself. Every walk is a vote for a woman who keeps her word. One vote doesn't win the election. But enough of them do.` },
{ label: "The compound effect", text: `Let's talk about the math of it, because it's kind of amazing.

If you improve just one percent each day, by the end of a year you're not one percent better. You're dramatically better, because each day builds on the one before it. It's like interest in a savings account. Small deposits, made consistently, turn into something big.

The same is true in the other direction. Skip once, it's nothing. Skip every time, and the distance quietly grows. Nobody gains fifty pounds in a day. Nobody loses their peace in a single morning. It's always the small things, repeated.

So the question isn't, can I do something huge today? The question is, can I do something small, again? And again. And again.

Showing up is a skill. And like any skill, it gets stronger every time you practice it.` },
W("Walk with it", 180, "As you walk, think about one small action that, done every day for a year, would change your life."),
{ label: "Motivation is a visitor", text: `Let's be honest with each other. Some days you will not feel motivated. You'll wake up tired. Your body will ache. Your mind will be full. The couch will look really good.

That's normal. Motivation is a visitor. It comes and goes, and it never calls ahead. Discipline is the one who lives with you.

The women you admire, the ones who seem so consistent, they don't feel motivated every day either. They've just stopped waiting for the feeling. They've decided that their goals are more important than their moods.

And here's a secret. Motivation often shows up after you start, not before. You put your shoes on, you get to the end of the block, and suddenly you feel a little better. Action creates motivation. Not the other way around.` },
W("Power walk", 180, "Pick up your pace for three minutes. This is you showing up even when it's hard. Arms strong, steps quick."),
{ label: "Shrink the goal, don't skip it", text: `Great work. Let your breathing settle while you keep walking.

Here's one of the most powerful tools I can give you. On the hard days, shrink the goal instead of skipping it.

Can't do thirty minutes? Do ten. Can't do the full workout? Do one round. Can't journal a page? Write one sentence. Can't cook a full healthy meal? Add one vegetable to whatever you're eating.

The version of you who shows up at fifty percent is still miles ahead of the version who waited for a perfect day. Perfect days don't come often. Ordinary days, done consistently, change everything.

What you're protecting on those hard days isn't the workout itself. It's the streak. It's the identity. It's the promise.` },
W("Walk with it", 180, "Think of your hardest day of the week. What is the smallest version of your habit you could still do on that day?"),
{ label: "Trust with yourself", text: `Here's what's really happening when you show up. You are building trust with yourself.

Think about a friend who always cancels plans at the last minute. After a while, you stop counting on her, right? You love her, but you don't trust her word.

We do the same thing to ourselves. Every time we say, I'll start Monday, and then don't, we teach ourselves that our word doesn't mean much. And then we wonder why we don't feel confident.

But every time you keep a promise to yourself, even a tiny one, you rebuild that trust. You're proving that your word means something, even when you're the only one who knows.

Over time, you stop saying, I'm trying to be someone who walks every day. You start saying, I'm someone who walks. I'm someone who takes care of herself. I'm someone who follows through.

That shift, from trying to being, is where the real transformation lives.` },
W("Affirmation walk", 180, "With every step, repeat: I keep my promises to myself. I keep my promises to myself."),
{ label: "Celebrate the reps", text: `Let's also talk about celebration, because we skip this part way too often.

You don't have to wait until you hit the big goal to be proud of yourself. Celebrate the reps. Celebrate the fact that you walked today. Celebrate the third day in a row. Celebrate drinking your water. Check the box, watch the streak grow, and let yourself feel good about it.

When you celebrate small wins, your brain releases a little bit of feel-good chemistry, and it starts to want more of that. Celebration isn't silly. It's fuel.

So today, when you finish this walk, I want you to actually stop for a second and say, I did that. I showed up.` },
W("Cool-down walk", 300, "Slow down your pace. Let your heart rate come down. Think about one thing you're proud of this week."),
{ label: "Close", text: `As you keep walking, pick one small promise for tomorrow. Make it so easy that you'd feel silly skipping it. Then keep it. And the day after that, keep it again.

Breathe in deeply. Breathe out slowly.

Say it with me: I show up for myself. Small steps, every day, are building the life I want.

You showed up today. I'm proud of you. Let's do it again tomorrow.` }
]},
{
id: "rewriting", cat: "Reinvention", title: "Rewriting Your Story",
desc: "It's never too late to become who you were meant to be.",
prompt: "What old story about myself am I ready to retire, and what is the new one?",
closing: "I am the author of my story. My past shaped me, but it does not get the final word.",
sections: [
{ label: "Arrive", text: `Welcome to your walk. Let's take a moment to land.

Feel the air on your skin. Notice what you hear around you, maybe birds, maybe traffic, maybe your own footsteps. Breathe in slowly through your nose, and as you breathe out, let your pace find you.

Today we're talking about the stories we tell about ourselves, and how you have every right to pick up the pen and write something new. This is one of my favorite conversations, because it's where so much freedom lives.

Let's warm up first. Just walk and breathe.` },
W("Warm-up walk", 240, "Walk at an easy pace. Breathe deeply. Let the day fall away behind you."),
{ label: "The stories we inherited", text: `All of us carry a story about who we are. Some of them sound like this. I'm not a morning person. I'm not athletic. I always quit. I'm bad with money. I'm the strong one, so I don't get to fall apart. I'm the one who takes care of everybody else. I've always been the big girl. I'm not the type of woman who gets that kind of life.

Where did these stories come from? Some were handed to us by family. Things we heard so many times growing up that we never questioned them. Some came from one embarrassing moment that stuck. The time you came in last in gym class. The time someone laughed at your idea. Some we picked up from years of comparing ourselves to other people.

Here's the important part. A story repeated long enough starts to feel like a fact. But it's still a story. It's a sentence someone wrote, often a long time ago, often without thinking. And stories can be revised.` },
W("Walk with it", 180, "As you walk, notice: what is one sentence I say about myself that keeps me small? Just catch it. Don't judge it."),
{ label: "Question the narrator", text: `Welcome back. Hold onto that sentence you noticed.

Now I want you to question it, gently, like a curious detective.

Is this true all of the time? Was there ever a moment when it wasn't true? If you say I always quit, can you think of one thing you didn't quit? You're still here, aren't you? You didn't quit on yourself, even on your hardest days.

Is it true right now, while I'm out here walking and choosing myself? Who told me this? Did they have the full picture? And who would I be without this sentence?

The fact that you're walking right now is already evidence against some of those old stories. You are rewriting them in real time, one step at a time.` },
{ label: "Your past is a chapter", text: `Your past is not a life sentence. It's a chapter. A meaningful one. It taught you things. It made you tough in places and tender in others. It gave you wisdom you couldn't have gotten any other way. You can honor it without living inside it forever.

Think about the women you admire most. Almost every one of them has a moment where she decided, this is not where my story ends. Maybe she started over at forty or fifty or sixty. Maybe she went back to school with kids at home. Maybe she left something that wasn't serving her. Maybe she simply decided to stop apologizing for wanting more.

You are allowed to have that moment too. And you don't need anyone's permission to have it. Not your family's. Not your friends'. Not the people who knew the old version of you. You only need your own.` },
W("Power walk", 180, "Pick up the pace for three minutes. Leave the old chapter behind you with every strong step."),
{ label: "Write the new line", text: `Beautiful. Keep moving.

Let's practice rewriting. Take that old sentence you noticed earlier, and flip it into something new that you're growing into.

I'm not athletic becomes, I'm a woman who moves her body with joy.
I always quit becomes, I'm learning to finish what I start.
I put everyone else first becomes, I take care of me so I can pour from a full cup.
I'm bad with money becomes, I'm learning to make wise choices with what I have.
I'm not the type becomes, I'm becoming exactly the type.

Notice that the new sentence doesn't have to be perfect, and it doesn't have to feel fully true yet. It just has to feel possible. A little stretch. Something you can grow into, like a dress that's a size too ambitious.

Say your new line to yourself now, in rhythm with your steps. Let your body learn it before your mind fully believes it.` },
W("Affirmation walk", 180, "Repeat your new sentence with every step. Say it like you mean it. Let it become familiar."),
{ label: "Act like the author", text: `A new story only becomes real when you act it out. Words matter, but actions are the proof.

So ask yourself: what would the woman in my new story do today? Not next year. Today.

Maybe she drinks her water. Maybe she sends the email she's been avoiding. Maybe she signs up for the class. Maybe she speaks kindly to herself in the mirror. Maybe she sets a boundary. Maybe she finishes this walk with her head held high.

Small actions are the sentences that make up your new chapter. And here's the beautiful part. Every time you act in line with your new story, it becomes a little more true. And every time it becomes more true, the next action gets a little easier.` },
W("Walk with it", 180, "As you walk, decide on one action the woman in your new story will take today. Picture yourself doing it."),
{ label: "When people remember the old you", text: `One more thing. When you start to change, not everyone will be ready for it. Some people will remember the old version of you and try to hold you to her. They might joke about it. They might not take you seriously at first.

That's okay. You don't need them to believe it for it to be true. Just keep living it. Let your consistency speak for you. Eventually, the people who love you will catch up, and the people who don't will fall away. Either way, you'll be free.` },
W("Cool-down walk", 300, "Slow your pace. Breathe easy. Feel the lightness of starting a new page."),
{ label: "Close", text: `Take a deep breath in, all the way to your belly. And let it go.

Repeat after me: I am the author of my story. My past shaped me, but it does not get the final word.

Keep walking, author. Your next page is blank, and you get to decide what goes on it.` }
]},
{
id: "lettinggo", cat: "Healing & Growth", title: "Letting Go of What Was",
desc: "Release the weight of the past and step into your future.",
prompt: "What am I still carrying that I'm ready to set down? What would I do with that space?",
closing: "I release what I cannot change. I make room for what is meant for me.",
sections: [
{ label: "Arrive", text: `Hi, love. Let's begin with your breath.

Breathe in for four counts. One, two, three, four. Hold for a moment. And breathe out slowly for six. Let your exhale be longer than your inhale. That tells your body it's safe to relax. Do that once more. In for four. Out for six.

Let your walk be gentle today. We're doing heart work, and heart work deserves softness. If any emotion comes up along the way, let it. Tears are welcome here. So is laughter. So is silence.

Let's start with a few minutes of easy walking.` },
W("Warm-up walk", 240, "Walk gently. Breathe in for four steps, out for six steps. Let your body soften."),
{ label: "What you're carrying", text: `Imagine you're carrying a backpack. Inside it are things from your past.

An old hurt that never got an apology. A relationship that ended, or one that should have. A version of yourself you miss. A mistake you keep replaying at two in the morning. Words someone said that still echo. A dream that didn't work out the way you hoped. Maybe grief for someone you lost.

You've been carrying this bag for a long time. You've gotten so used to the weight that you may not even notice it anymore. But your body notices. Your shoulders notice. Your sleep notices. Your energy and your joy notice.

Today, you don't have to empty the whole bag. That would be too much for one walk. You just have to take one thing out.` },
W("Walk with it", 180, "As you walk, gently ask: what is in my bag? Which one thing am I ready to take out today?"),
{ label: "Letting go is not forgetting", text: `Let's clear something up, because it keeps a lot of us stuck.

Letting go doesn't mean it didn't matter. It doesn't mean what happened was okay. It doesn't mean you have to call anybody, or reconcile, or pretend you weren't hurt. You can let go and still have boundaries. You can let go and still remember.

Letting go simply means you stop letting it decide how you feel today. You take your power back from a moment that's already over. You stop paying rent to a memory.

It's also okay if you've tried to let go before and picked it back up again. Healing isn't a straight line. It's more like a walk around a neighborhood. Sometimes you loop back past the same corner. That doesn't mean you're not making progress. Keep walking.` },
{ label: "Feel it to free it", text: `Sometimes we hold on because we never let ourselves fully feel it. We stayed busy. We stayed strong. We told ourselves we didn't have time to fall apart.

But feelings that aren't felt don't disappear. They wait. They show up as tension, as snapping at people we love, as emotional eating, as exhaustion that sleep doesn't fix.

So for a moment, let yourself feel it. Not to drown in it, just to acknowledge it. If it's sadness, say, I'm sad, and that makes sense. If it's anger, say, I'm angry, and I'm allowed to be. If it's disappointment, say, I really wanted that, and it hurts that it didn't happen.

Naming a feeling takes away a lot of its power. You're not weak for feeling it. You're brave.` },
W("Walk with it", 180, "Walk and name what you feel. Say it simply: I feel... Let the feeling move through you as you move."),
{ label: "Release with your body", text: `Let's use your body to help.

As you walk, think of that one thing you're ready to set down. On your next inhale, gather it up. Notice where you feel it. Maybe your chest. Your shoulders. Your stomach. Your throat.

Now exhale, and imagine it leaving through your feet with every step, sinking into the ground behind you. The earth can hold it. You don't have to anymore.

Step. Release. Step. Release.

Shake out your hands if you want to. Roll your shoulders back. Open your mouth and let out a sigh, a real one. You are lighter than you were ten minutes ago.` },
W("Release walk", 210, "With every exhale, imagine the weight leaving through your feet. Step. Release. Step. Release."),
{ label: "Forgiveness, including yourself", text: `Now, a word about forgiveness. Not because anyone deserves it, but because you deserve peace.

Forgiveness isn't saying it was okay. It's saying, I'm no longer going to carry the debt. I'm releasing you from my mind, so I can be free.

And sometimes the person we most need to forgive is ourselves. For staying too long. For not knowing better. For the choices we made when we were hurting or scared or young. You did the best you could with what you knew then. Now you know more. That's growth, not failure.

If you're ready, try saying this in your heart: I forgive myself for not knowing what I didn't know. I'm learning now.` },
W("Walk with it", 180, "Walk and gently ask: who do I need to forgive, even if it's me? Let the answer come without forcing it."),
{ label: "Make room", text: `When you let go of something, you create space. And space is where new things grow.

What would you like to welcome into that space? Peace? New friendships? A healthier relationship? Energy for your goals? Rest? Joy that doesn't feel guilty? A softer relationship with yourself?

Picture it. Really picture it. See yourself a few months from now, lighter, smiling more easily, sleeping better, walking this same route with a little more freedom in your step.

That woman is not a fantasy. She's the next version of you. And she's closer than you think.` },
W("Cool-down walk", 300, "Slow your pace. Picture the space you've made and what you'd like to fill it with. Breathe easy."),
{ label: "Close", text: `Let's close with one more slow breath. In through your nose. Out through your mouth.

Repeat after me: I release what I cannot change. I make room for what is meant for me.

Be gentle with yourself the rest of today. Drink some water. Rest if you can. You did brave work out here.` }
]},
{
id: "fear", cat: "Confidence", title: "Walking Through Fear",
desc: "Courage isn't the absence of fear — it's moving forward anyway.",
prompt: "What would I do this week if fear got a vote, but not the final say?",
closing: "I can feel fear and still move forward. Courage lives in my next step.",
sections: [
{ label: "Arrive", text: `Hey, brave one. Let's walk.

Start easy for a few minutes. Let your body warm up. Then, as we go, I'm going to ask you to pick up your pace. Feel your heart rate rise. Notice how your body handles effort, and handles it just fine.

That's what we're talking about today. Handling the hard stuff, even when you're scared. Because courage isn't something you're born with or without. It's something you practice, just like walking.

Take a deep breath, and let's go.` },
W("Warm-up walk", 240, "Walk at an easy pace for four minutes. Breathe deeply and let your body warm up."),
{ label: "Fear is a messenger", text: `Let's start by making peace with fear.

Fear isn't your enemy. It's an old alarm system that lives in your brain, built to keep you safe. Thousands of years ago it kept our ancestors away from cliffs and wild animals. It's very good at its job.

The problem is, it can't tell the difference between real danger and something that's simply new. Starting a business, posting the video, walking into the gym for the first time, having the honest conversation, applying for the job, wearing the outfit, saying no. Your brain sounds the same alarm for all of them. Racing heart. Tight chest. A voice that says, don't do it, what if they laugh, what if you fail.

So when fear shows up, you don't need to argue with it or be ashamed of it. Just say, thank you, I hear you. I know you're trying to protect me. And then decide for yourself.` },
W("Walk with it", 180, "As you walk, ask: what is fear trying to protect me from right now? Is that danger real, or is it just new?"),
{ label: "What fear costs", text: `We often think about what might happen if we're brave. What if I fail. What if I'm embarrassed. What if it doesn't work.

But let's flip that question. What does fear cost you if you never move past it?

Think about the dream that's been sitting on the shelf for years. The business idea. The trip. The career change. The relationship you want. The body you want to feel strong in. What does another year of waiting cost? Another five years?

Fear makes the risk of trying look huge, and the risk of staying the same look small. But staying the same has a cost too. It's just quieter. It shows up as regret, as wondering what if, as watching other people do the thing you knew you could do.

You deserve to find out what you're capable of.` },
W("Power walk", 180, "Pick up the pace for three minutes. Feel your heart beat faster. This is what brave feels like in your body."),
{ label: "Courage is a step", text: `Great work. Keep moving.

Notice what just happened. Your heart rate went up. Your breathing got faster. Maybe it felt a little uncomfortable. That's almost exactly what fear feels like in your body. The difference is, you didn't stop. You kept walking. You chose to stay in it.

That's courage. Courage is not a feeling you wait for. It's a decision you make with your feet.

And you don't have to take the whole leap today. Just the next step. Send the first message. Write the first line. Book the first class. Make the first phone call. Ask the first question.

Fear gets smaller when you move. It gets bigger when you sit still and think about it. So we keep moving, just like you're doing right now.` },
W("Walk with it", 180, "Think of one thing fear has been holding you back from. What is the very smallest first step?"),
{ label: "Borrow courage", text: `Here's another trick. When you don't feel brave, borrow courage from someone else.

Think of a woman you admire. Maybe someone you know personally, maybe a grandmother, a mentor, a friend. Maybe someone you've only read about. Picture how she walks into a room. Picture how she'd handle the thing you're scared of.

Now ask, what would she do? And then, just for today, do it the way she would. Walk like her. Speak like her. You'd be surprised how much courage is hiding inside you, just waiting for a role model to give it permission.

And remember your own track record. You have done scary things before. The first day of a new job. Becoming a mother. Starting over. Showing up after heartbreak. You were scared then too, and you did it anyway. That woman is still in you.` },
W("Affirmation walk", 180, "Repeat with every step: I am brave. I can do hard things. I am brave. I can do hard things."),
{ label: "If it doesn't work", text: `Let's address the biggest fear of all. What if I try, and it doesn't work?

Here's the truth. Sometimes it won't. Not every brave step lands perfectly. But a step that doesn't work isn't a failure. It's information. It shows you what to adjust. Every successful woman you know has a long list of things that didn't work on the way to the things that did.

And here's something else. You will be proud of yourself for trying, no matter how it turns out. Nobody ever looks back and regrets being brave. We only regret the times we let fear make the decision for us.` },
W("Cool-down walk", 300, "Slow your pace and let your breath settle. Notice the strength in your legs. They carried you through."),
{ label: "Close", text: `Take a big breath in. Feel your chest open wide. And breathe out.

Repeat after me: I can feel fear and still move forward. Courage lives in my next step.

]},

id: "habits", cat: "Self-Discipline", title: "Building Unshakeable Habits",
desc: "The science and soul of consistency.",
prompt: "Which habit am I building right now, and how can I make it easier to win?",
closing: "My habits are my daily gift to the woman I'm becoming. I make them easy, and I keep them.",
sections: [
{ label: "Arrive", text: `Welcome back. I'm so glad you're here.

Let's start by settling into a comfortable, steady pace. Breathe in through your nose. Breathe out through your mouth. Feel your arms swing naturally at your sides.

Today we're going to get practical. We're talking about how habits actually work, and how you can build ones that stick, even when life gets messy. By the end of this walk, I want you to have a real plan for one habit you're building.

First, let's warm up.` },
W("Warm-up walk", 240, "Walk at a comfortable pace for four minutes. Think about one habit you'd love to make automatic."),
{ label: "How a habit works", text: `Every habit follows a simple loop. First there's a cue, something that reminds you. Then there's the routine, the thing you actually do. And then there's the reward, the good feeling that makes your brain want to do it again.

Let's look at an example you might know. You sit on the couch after dinner. That's the cue. You grab a snack and scroll your phone. That's the routine. And that little hit of comfort and entertainment is the reward.

Your brain isn't lazy. It's efficient. It repeats what's easy and what feels good, so it can save energy for other things. Once a loop repeats enough times, it runs on autopilot.

So if we want new habits to stick, we have to work with that loop, not against it. Let's go through how.` },
W("Walk with it", 180, "Think of one habit you already have, good or not so good. What's the cue? What's the reward?"),
{ label: "Make it obvious", text: `Step one: make your cue obvious. Don't rely on remembering. Willpower is unreliable, but your environment is always there.

Set things up so the habit is staring right at you. Put your walking shoes by the door. Fill your water bottle the night before and leave it on the counter. Leave your journal on your pillow. Put the fruit in a bowl on the table and the chips on a high shelf.

One powerful trick is called habit stacking. Attach your new habit to something you already do every day. After I pour my coffee, I'll write one thing I'm grateful for. After I brush my teeth, I'll do ten squats. After I drop the kids off, I'll walk for fifteen minutes.

The old habit becomes the reminder for the new one. You're borrowing a routine you already trust.` },
{ label: "Make it easy", text: `Step two: make it easy. Ridiculously easy.

Most of us start too big. We go from zero to an hour at the gym every day, a complete diet overhaul, and waking up at five a.m., all at once. And by week two we're exhausted and done, and we tell ourselves we just don't have discipline.

That's not a discipline problem. It's a design problem.

Instead, start with a version so small you can't say no. Two minutes of stretching. One glass of water when you wake up. A five minute walk. One page of reading.

You're not trying to get results in week one. You're trying to become the kind of person who shows up. Once the habit is part of who you are, growing it is the easy part.` },
W("Power walk", 180, "Pick up your pace for three minutes. Strong arms, quick steps. You're building the habit right now."),
{ label: "Make it rewarding", text: `Nice. Let your breathing settle while you keep walking.

Step three: make it rewarding. Your brain needs to feel a win, or it won't come back.

That's why tracking works so well. Checking that box, watching your streak grow, seeing your steps add up, it's a small celebration every single time. It's why this app shows you your streak. That little flame isn't just decoration. It's a reward for your brain.

You can also pair habits with things you enjoy. Only listen to your favorite podcast or playlist on your walks. Make your water look pretty with lemon or berries. Wear workout clothes that make you feel good. Light a candle when you journal.

When the habit feels good, you'll want to come back. That's not cheating. That's strategy.` },
W("Walk with it", 180, "Pick one habit you're building. How could you make it more obvious, easier, and more rewarding this week?"),
{ label: "Never miss twice", text: `Here's a rule that changes everything: never miss twice.

You will miss a day. Everybody does. Life happens. Kids get sick, work runs late, you're traveling, or you're just plain tired. Missing one day is not failure. It's human.

But missing two days in a row is the start of a new habit, the habit of skipping. So when you miss, don't spiral. Don't tell yourself you've ruined everything. Don't wait to start over on Monday.

Just make sure the next day, you do something, even the smallest version. Five minutes instead of thirty. One glass of water instead of eight. Get right back on the path. The comeback matters more than the slip.` },
{ label: "Design your environment", text: `Let's talk about one more powerful tool: your environment.

The people and spaces around you shape your habits more than you realize. If your kitchen is full of snacks, you'll snack. If your phone is next to your bed, you'll scroll. If your friends walk every Saturday, you'll walk too.

So make the good habits convenient and the unhelpful ones inconvenient. Put your phone in another room at night. Keep cut-up fruit at eye level in the fridge. Find a walking buddy or join a group of women working on the same goals.

You don't have to fight yourself every day. You can arrange your life so the right choice is the easy choice.` },
W("Affirmation walk", 180, "Repeat with every step: I make it easy. I keep showing up. I make it easy. I keep showing up."),
{ label: "The soul of it", text: `We've talked about the science. Now let's talk about the soul.

Your habits are not punishment for who you were. They are a gift to who you're becoming. Every glass of water says, I care about my body. Every walk says, my health matters. Every journal entry says, my thoughts deserve space. Every early night says, I deserve rest.

When you shift from I have to, to I get to, discipline starts to feel like self-love. I get to move my body. I get to feed myself well. I get to take this time for me. Not everyone gets to. You do.` },
W("Cool-down walk", 300, "Slow your pace. Breathe easy. Choose the one habit you'll focus on this week."),
{ label: "Close", text: `Let's take a deep breath together. In. And out.

As you finish your walk, lock in your plan. One habit. Make it obvious. Make it easy. Make it rewarding. And never miss twice.

Repeat after me: My habits are my daily gift to the woman I'm becoming. I make them easy, and I keep them.

You're building something unshakeable. One day at a time.` }
]},

desc: "Permission to begin again, with purpose.",

closing: "Today is page one. I begin again with purpose, and I'm proud of where I'm going.",
sections: [
{ label: "Arrive", text: `Good to see you out here. Let's begin.

Lift your eyes and look ahead of you. Notice the path in front of you, not the one behind. Take a deep breath, and let yourself feel the fresh start in the air.

Today is about beginning again, and doing it on purpose. Not a frantic, everything-changes-Monday kind of fresh start. A calm, clear, intentional one.

Let's warm up first. Easy steps, deep breaths.` },
W("Warm-up walk", 240, "Walk at an easy pace. Keep your eyes forward on the path ahead. Breathe in fresh starts."),
{ label: "Permission granted", text: `Maybe you've started over before. Maybe more than once. Maybe more times than you can count. Maybe you feel a little embarrassed to begin again, like you should be further along by now.

I want you to hear this clearly. You are allowed to start over as many times as it takes.

Every restart comes with more wisdom than the last one. You know more about yourself now. You know what didn't work. You know what you won't tolerate anymore. You know what matters. You're not starting from zero. You're starting from experience.

There's no deadline on becoming who you want to be. There's no age limit on a glow up. Some of the most beautiful chapters are written later in the story.` },
W("Walk with it", 180, "As you walk, think about what you've learned from your last fresh start. What do you know now that you didn't know then?"),
{ label: "Close the last chapter", text: `Before we write a new chapter, let's close the last one with care.

What are you proud of from the last season of your life? Even if it was hard. Especially if it was hard. Maybe you survived something. Maybe you learned to say no. Maybe you finally asked for help. Give yourself credit for that.

And what are you leaving behind? A habit that kept you stuck. A mindset that kept you small. A relationship pattern. A way of talking to yourself.

You can close that chapter with gratitude for what it taught you, and still be clear that you're not going back. Thank you, and goodbye.` },
{ label: "Begin with purpose", text: `Now, this time, let's begin with your why. Not just what you want to change, but why it matters to you.

Do you want more energy to play with your kids or grandkids? To feel at home in your body? To prove to yourself that you can? To build a life and business you're proud of? To be an example for someone watching you? To finally feel peace?

Get specific. A vague why fades fast. A specific why carries you through the hard days. I want to keep up with my daughter on hikes is so much more powerful than I want to be healthier.

Say your why to yourself as you walk. When motivation fades, and it will, your why is what will carry you.` },
W("Power walk", 180, "Pick up the pace for three minutes. With every strong step, repeat your why."),
{ label: "Three simple steps", text: `Beautiful. Keep moving at a steady pace.

Now let's make your next chapter real with three simple steps.

One. Decide one thing you're leaving in the last chapter. Just one. A habit, a mindset, a pattern.

Two. Choose one thing you're bringing into this chapter. A daily walk, a morning routine, a new boundary, a weekly meal prep, a bedtime.

Three. Take one action today. Not tomorrow. Today. Even something small, like writing your goal down, scheduling your next walk in your calendar, or telling a friend what you're working on.

That's it. Not twenty changes. Three simple decisions. Big chapters are built from small, clear choices.` },
W("Walk with it", 180, "Walk through your three steps: one thing to leave, one thing to bring, and one action for today."),
{ label: "Expect the messy middle", text: `I want to prepare you for something. Every new chapter has a messy middle.

The beginning feels exciting. The end feels amazing. But the middle is where it gets boring, or hard, or slow. It's where the excitement wears off and you're just doing the work without seeing results yet.

That's where most people quit. Not because they failed, but because the middle felt like failure.

So when you hit the messy middle, and you will, remember this moment. Remember that you knew it was coming. Remember that the middle is not the end. It's just the part of the story where the character gets stronger.` },
W("Affirmation walk", 180, "Repeat with every step: I begin again with purpose. I begin again with purpose."),
{ label: "See her", text: `Before we close, let's take a moment to see her. The woman at the end of this chapter.

W("Cool-down walk", 300, "Slow your pace. Hold the picture of her in your mind. Smile at her."),
{ label: "Close", text: `Breathe in deeply. Feel your lungs fill. Breathe out and let the old chapter close.

id: "grace", cat: "Healing & Growth", title: "Grace Over Guilt",
desc: "Replace self-criticism with compassion and watch yourself grow.",
prompt: "What would I say to a friend in my situation? Can I say that to myself today?",
closing: "I choose grace over guilt. I can be a work in progress and still be proud of myself.",
sections: [
{ label: "Arrive", text: `Hi, friend. Let's walk softly today.

Take a breath in, and as you breathe out, place a hand on your heart if you'd like. Feel it beating. It has been working for you every single second of your life, through every high and every low, without you ever asking it to.

Let's offer ourselves that same kind of quiet care today. No pushing. No proving. Just walking and listening.

Let's start with a few easy minutes.` },
W("Warm-up walk", 240, "Walk slowly and gently. Keep a hand on your heart for a few breaths if it feels good."),
{ label: "The guilt cycle", text: `Have you ever noticed how hard we are on ourselves?

You miss a workout and the voice says, see, you always quit. You eat the cookie and suddenly the whole day is ruined, so you might as well eat the whole box. You snap at someone you love and you replay it all night long. You forget something at work and call yourself stupid in your head.

Guilt says, you did something wrong, so you are something wrong. And here's the problem. That weight usually makes us do worse, not better. When we feel ashamed, we hide. We quit. We numb out with food, or our phones, or busyness. We avoid the very things that would help us.

Guilt keeps us stuck in a cycle. Mess up, feel terrible, give up, mess up again.

Grace breaks that cycle.` },
W("Walk with it", 180, "As you walk, notice: where have I been hard on myself lately? What has my inner voice been saying?"),
{ label: "Talk to yourself like a friend", text: `Think of your best friend. Picture her face. Now imagine she came to you and said she'd missed a few workouts, eaten badly all week, and felt like a total failure.

What would you say to her?

You'd probably say something like, girl, you've had a lot going on. You're doing so much. One week doesn't erase your progress. Let's just get back to it tomorrow. I'm proud of you for even caring this much.

You'd never call her lazy. You'd never tell her she's disgusting or hopeless. You wouldn't even think it.

Now say that kind thing to yourself. Out loud if you can. Same tone. Same warmth. You deserve the kind of encouragement you give so freely to everyone else.` },
W("Affirmation walk", 180, "Speak to yourself like your best friend would. Try: I'm doing my best, and my best is enough today."),
{ label: "Guilt versus responsibility", text: `Now, grace doesn't mean we never take responsibility. There's a difference between guilt and accountability.

Guilt looks backward and beats you up. Accountability looks forward and asks, what can I learn? What will I do differently?

Guilt says, I'm terrible for yelling at my kids. Accountability says, I lost my temper because I was exhausted. I'll apologize, and I'll try to get more rest so I have more patience.

Guilt says, I ruined my diet. Accountability says, I was really hungry because I skipped lunch. Tomorrow I'll pack something.

See the difference? Accountability gives you a next step. Guilt just gives you a heavy heart.` },
{ label: "Grace is not giving up", text: `Grace doesn't mean you stop caring or stop trying. It means you can look at what happened honestly, learn from it, and move forward without beating yourself up.

Grace says, that wasn't my best, and I'm still worthy.
Grace says, I'm learning.
Grace says, tomorrow is a new chance.
Grace says, I can hold high standards and a soft heart at the same time.

And here's the beautiful part. Women who give themselves grace actually keep going longer. Because they're not exhausted from fighting themselves. All that energy that used to go into self-criticism can now go into growth.` },
W("Power walk", 180, "Pick up the pace for three minutes. Walk with energy. Feel how much lighter you are without the guilt."),
{ label: "Grace in the small moments", text: `Nicely done. Ease back to a comfortable pace.

Let's make grace practical. Here are a few small moments where you can practice it this week.

When you look in the mirror, find one thing you appreciate before you find anything to criticize.

When you miss a habit, say, that's okay, I'll do the small version tomorrow, and move on.

When you make a mistake at work or at home, say, I'm human, and handle it without the extra layer of shame.

When you rest, don't apologize for it. Rest is not something you earn. It's something you need.

Every time you choose grace in a small moment, it gets a little easier to choose it in the big ones.` },
W("Walk with it", 180, "Think of one small moment this week where you'll choose grace instead of guilt. Picture it clearly."),
{ label: "Grace for the woman you were", text: `Finally, let's extend some grace backward, to the woman you used to be.

The younger you who didn't know her worth. The you who stayed too long, or said yes when she meant no, or didn't take care of her body because she was busy taking care of everyone else. The you who did her best with what she had.

She got you here. She deserves compassion, not criticism. If you could talk to her right now, what would you say? Maybe, I understand. You were doing your best. Thank you for not giving up. I've got it from here.` },
W("Cool-down walk", 300, "Slow your pace. Send kindness back to the woman you used to be. Breathe gently."),
{ label: "Close", text: `Take a slow breath in. Breathe out any leftover guilt you're holding.

Repeat after me: I choose grace over guilt. I can be a work in progress and still be proud of myself.

Finish your walk gently. Treat yourself kindly for the rest of the day. You are doing better than you think.` }
]}

{ label: "Letting go of control", text: `Sometimes the thing we need to let go of isn't the past. It's control.

We try so hard to control how things turn out. How people see us. How our kids turn out. Whether the relationship works. Whether the plan goes perfectly. And when we can't control it, we worry, we overthink, we lie awake running through every possible scenario.

Here's a simple practice. Picture two circles. In the first circle, put everything you can control. Your words. Your choices. Your effort. How you treat yourself. Whether you take this walk. In the second circle, put everything you can't. Other people's opinions. Other people's choices. The past. The weather. The timing of things.

Now, give your energy to the first circle. And for the second circle, practice saying, I release this. I've done my part.

{ label: "Fear in your body", text: `Let's get practical about what to do when fear shows up in your body.

When fear hits, your breath gets shallow and fast. Your shoulders creep up. Your stomach tightens. Your thoughts start to race. That's your nervous system getting ready to run.

You can talk to your nervous system through your body. Here's how.

First, slow your exhale. Breathe in for four, and out for six or eight. A long exhale tells your body it's safe.

Second, drop your shoulders and unclench your jaw. Tension feeds fear, and softness calms it.

Third, plant your feet. Feel the ground under you. Name five things you can see right now. This brings you back to the present moment, where you're actually okay.

Fourth, move. Walk, shake out your hands, roll your neck. Fear is energy, and movement gives that energy somewhere to go. That's one reason walking is so powerful. You're literally processing fear with every step.

Use these tools before the big meeting, before the hard conversation, before you hit post. Your body can be your biggest ally in being brave.` },

{ label: "Brave is a habit", text: `Here's the last thing I want you to know. Bravery is a habit, just like walking.

nextchapter: [
{ label: "Your support system", text: `Let's talk about who's coming with you into this next chapter.

New chapters go better with support. Who in your life makes you feel capable? Who cheers for you? Who tells you the truth in love? Those are the people to lean on now.

And be honest with yourself about the people who pull you back. The ones who make jokes about your goals, who tempt you off track, who only seem comfortable when you stay the same. You don't have to cut everyone off. But you can choose how much access they have to your dreams while you're building them.

If you don't have the support you need yet, go find it. Join a walking group. Find an online community of women working on the same goals. Tell one trusted friend what you're doing and ask her to check in on you. Or be that support for someone else, because lifting another woman up always lifts you too.

You don't have to write this chapter alone.` },
W("Body check-in", 180, "As you walk, think of one person you could invite into this new chapter. Picture telling her your goal."),
{ label: "Celebrate the start", text: `And one more thing. Celebrate the start.

We usually wait until the end to celebrate. But starting is brave. Deciding is brave. Choosing yourself again is brave. So today, do something small to mark this new beginning. Write the date in your journal. Treat yourself to a fresh notebook. Make a playlist for your next chapter. Tell yourself, out loud, I'm proud of you for starting.

Beginnings deserve to be honored.` }
],
grace: [
{ label: "Rest is part of the work", text: `Let's talk about rest, because it's one of the places where we feel the most guilt.

So many of us feel guilty when we rest. Like we have to earn a nap. Like sitting down means we're lazy. Like there's always one more thing we should be doing first.

But rest is not the opposite of progress. It's part of it. Your muscles grow stronger while you rest, not while you work out. Your mind sorts through the day while you sleep. Your creativity comes back when you give it space.

A woman who never rests eventually burns out. And burnout doesn't care how disciplined you are.

So this week, practice resting without apologizing. Take the nap. Sit on the porch. Go to bed early. Say no to the extra commitment. And when the guilt shows up, say, rest is part of the work. I'm recharging so I can keep going.

You are not a machine. You are a woman. And you are allowed to rest.` },
W("Body check-in", 180, "Walk slowly and notice where you're holding tension. Let each part soften as you breathe out."),
{ label: "Celebrate the small wins", text: `Before we cool down, let's celebrate. Grace isn't just about forgiving the misses. It's also about noticing the wins.

Think of three things you did well this week. They can be tiny. You drank your water. You were patient with someone. You took this walk. You got out of bed on a hard day.

Say them to yourself now. And say, I'm proud of me. You don't need to wait for anyone else to say it first.` }
]
};

  t.sections.splice(i < 0 ? t.sections.length - 1 : i, 0, ...(DEEPER[t.id] || []));
});
// Estimated minutes: spoken parts at about 140 words per minute plus timed walking intervals.
TALKS.forEach(t => {
  const secs = t.sections.reduce((a, s) => a + (s.walk ? s.walk : s.text.split(/\s+/).length / 140 * 60), 0);
  t.mins = Math.ceil(secs / 60);
});

const I = (n, cls='') => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${P[n]||''}</svg>`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- state ----------
const KEY = 'mm-app-v1';
const DEFAULT_HABITS = [
  {id:'walk', label:'Walk for 30 minutes', icon:'steps'},
  {id:'water', label:'Drink 8 glasses of water', icon:'drop', auto:'water'},
  {id:'audio', label:'Listen to a Walk Talk', icon:'talk', auto:'talk'},
  {id:'move', label:'Complete a workout', icon:'dumbbell', auto:'workout'},
  {id:'journal', label:'Journal or check in', icon:'pen', auto:'journal'}
];
function fresh(){ return {name:'', stepsGoal:10000, waterGoal:8, goalV:2, habits:DEFAULT_HABITS.map(h=>({...h})), days:{}, journal:[], favTalks:[], favRecipes:[], talkDone:{}, workoutDone:{}, grocery:[]}; }
let S = fresh();
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(fresh(), JSON.parse(raw)); } catch(e) {}
if (!S.goalV) { if (S.stepsGoal === 6000) S.stepsGoal = 10000; S.goalV = 2; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }

const pad = n => String(n).padStart(2,'0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayKey = () => keyOf(new Date());
function day(k=todayKey()){ if(!S.days[k]) S.days[k] = {steps:0, water:0, done:{}, mood:0, talks:[], workouts:[], minutes:0}; return S.days[k]; }
function peek(k){ return S.days[k] || null; }
const dayIndex = () => Math.floor(new Date(todayKey()+'T12:00:00').getTime()/864e5);
function journaledOn(k){ return S.journal.some(j=>j.date===k); }
function habitDone(h, k=todayKey()){
  const d = peek(k); if(!d) return h.auto==='journal' ? journaledOn(k) : false;
  if (d.done[h.id]) return true;
  if (h.auto==='water') return d.water >= S.waterGoal;
  if (h.auto==='talk') return d.talks.length>0;
  if (h.auto==='workout') return d.workouts.length>0;
  if (h.auto==='journal') return journaledOn(k);
  return false;
}
function active(k){ return S.habits.some(h=>habitDone(h,k)) || (peek(k)?.mood>0); }
function streak(){
  let n=0; const d=new Date();
  if(!active(keyOf(d))) d.setDate(d.getDate()-1);
  while(active(keyOf(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function habitsPct(){ const done=S.habits.filter(h=>habitDone(h)).length; return S.habits.length? done/S.habits.length : 0; }
